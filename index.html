<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>简历速填</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <nav class="title-nav" id="titleNav"></nav>
    <div class="bar-actions">
      <button id="btnFolder" class="bar-btn" title="打开文件夹">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button id="btnTop" class="bar-btn pinned" title="取消置顶">
        <svg viewBox="0 0 1024 1024" width="13" height="13" fill="currentColor" aria-hidden="true">
          <path d="M849.454545 46.545455a34.909091 34.909091 0 1 1 0 69.818181h-651.636363a34.909091 34.909091 0 1 1 0-69.818181h651.636363zM563.479273 157.765818l301.498182 254.882909c16.709818 16.709818 21.666909 41.611636 12.613818 63.418182A57.972364 57.972364 0 0 1 823.831273 512H698.181818v408.715636A56.808727 56.808727 0 0 1 641.442909 977.454545H405.829818A56.808727 56.808727 0 0 1 349.090909 920.715636V512H223.441455a57.972364 57.972364 0 0 1-53.76-35.909818 58.042182 58.042182 0 0 1 12.613818-63.418182l2.141091-1.978182L483.793455 157.765818a58.298182 58.298182 0 0 1 79.685818 0zM628.363636 442.181818h163.537455L523.636364 215.505455 255.371636 442.181818H418.909091v465.454546h209.454545V442.181818z"/>
        </svg>
      </button>
      <button id="btnEdit" class="bar-btn" title="编辑配置">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </button>
      <button id="btnHelp" class="bar-btn text" title="使用说明">?</button>
      <button id="btnClose" class="bar-btn close" title="关闭">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="body">
    <main class="content" id="content"></main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
